name: Ingest assets

on:
  push:
    paths:
      - "incoming/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Ingest pointer files
        id: ingest
        run: python3 .github/scripts/ingest_assets.py

      - name: Commit ingested assets
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets incoming
          git commit -m "Ingest assets from incoming/"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Fail the run if any pointer could not be ingested
        if: steps.ingest.outputs.failed == 'true'
        run: |
          echo "::error::One or more incoming/ pointer files failed verification and were left in place. See the warnings above for why."
          exit 1
