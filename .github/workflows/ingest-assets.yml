name: Ingest incoming assets
on:
  push:
    branches: [main]
    paths:
      - "incoming/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ingest-assets
  cancel-in-progress: false
jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode or fetch incoming files
        run: |
          set -uo pipefail
          shopt -s globstar nullglob
          count=0
          for f in incoming/**; do
            [[ -f "$f" ]] || continue
            base="${f#incoming/}"
            case "$base" in
              README.md|.gitkeep) continue ;;
            esac
            if [[ "$f" == *.url ]]; then
              dest="assets/${base%.url}"
              url="$(tr -d '\r' < "$f" | sed '/^[[:space:]]*$/d; /^#/d' | head -1)"
              mkdir -p "$(dirname "$dest")"
              if curl -fsSL "$url" -o "$dest"; then
                rm -f "$f"
                echo "fetched $url -> $dest"
                count=$((count+1))
              else
                echo "WARN fetch failed $url"
              fi
            elif [[ "$f" == *.b64 ]]; then
              dest="assets/${base%.b64}"
              mkdir -p "$(dirname "$dest")"
              if python3 -c "import base64,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=pathlib.Path(sys.argv[2]); raw=''.join(p.read_text().split()); pad=(-len(raw))%4; raw+= '='*pad; d.write_bytes(base64.b64decode(raw))" "$f" "$dest"; then
                rm -f "$f"
                echo "decoded $f -> $dest"
                count=$((count+1))
              else
                echo "WARN decode failed $f"
                rm -f "$dest"
              fi
            else
              echo "skip $f (use .url or .b64)"
            fi
          done
          echo "INGESTED=$count" >> "$GITHUB_ENV"
      - name: Commit ingested binaries
        if: env.INGESTED != '0'
        run: |
          git config user.name "tnv-assets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets incoming
          git diff --cached --quiet && exit 0
          git commit -m "Ingest incoming assets"
          git push
