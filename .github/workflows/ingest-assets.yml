name: Ingest incoming assets
on:
  push:
    branches: [main]
    paths:
      - "incoming/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ingest-assets
  cancel-in-progress: false
jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode or fetch incoming files
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          count=0
          for f in incoming/**; do
            [[ -f "$f" ]] || continue
            base="${f#incoming/}"
            case "$base" in
              README.md|.gitkeep) continue ;;
            esac
            if [[ "$f" == *.url ]]; then
              dest="assets/${base%.url}"
              url="$(tr -d '\r' < "$f" | sed '/^[[:space:]]*$/d; /^#/d' | head -1)"
              mkdir -p "$(dirname "$dest")"
              curl -fsSL "$url" -o "$dest"
              rm -f "$f"
              echo "fetched $url -> $dest"
              count=$((count+1))
            elif [[ "$f" == *.b64 ]]; then
              dest="assets/${base%.b64}"
              mkdir -p "$(dirname "$dest")"
              base64 -d "$f" > "$dest"
              rm -f "$f"
              echo "decoded $f -> $dest"
              count=$((count+1))
            else
              echo "skip $f (use .url or .b64)"
            fi
          done
          echo "INGESTED=$count" >> "$GITHUB_ENV"
      - name: Commit ingested binaries
        if: env.INGESTED != '0'
        run: |
          git config user.name "tnv-assets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets incoming
          git diff --cached --quiet && exit 0
          git commit -m "Ingest incoming assets"
          git push
